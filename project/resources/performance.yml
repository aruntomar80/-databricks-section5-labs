resources:
  pipelines:
    silver_pipeline:
      name: ${var.namespace}_${bundle.target}_silver
      catalog: ${var.catalog}
      schema: ${var.schema_name}
      serverless: true
      continuous: false
      configuration:
        lab.catalog: ${var.catalog}
        lab.schema: ${var.schema_name}
      libraries:
        - glob:
            include: ../src/silver_pipeline.py

  jobs:
    performance_job:
      name: ${var.namespace}_${bundle.target}_performance
      max_concurrent_runs: 1
      tasks:
        - task_key: seed
          notebook_task:
            notebook_path: ../src/01_seed.py
            base_parameters:
              catalog: ${var.catalog}
              schema_name: ${var.schema_name}
        - task_key: silver
          depends_on:
            - task_key: seed
          pipeline_task:
            pipeline_id: ${resources.pipelines.silver_pipeline.id}
        - task_key: publish_and_verify
          depends_on:
            - task_key: silver
          notebook_task:
            notebook_path: ../src/02_publish_and_verify.py
            base_parameters:
              catalog: ${var.catalog}
              schema_name: ${var.schema_name}
              environment: ${bundle.target}
              slow_threshold: ${var.slow_threshold}
              run_key: "{{job.run_id}}"
